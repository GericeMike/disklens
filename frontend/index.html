<!DOCTYPE html>
<html lang="zh-CN" data-style="terminal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘镜 DiskLens</title>
    <link rel="stylesheet" href="/src/taste/fonts.css">
    <link rel="stylesheet" href="/src/taste/base.css">
    <link rel="stylesheet" href="/src/taste/disklens.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="8.5" stroke="var(--accent)" stroke-width="1.8"/>
                    <circle cx="11" cy="11" r="3.5" fill="var(--accent)"/>
                </svg>
                <div>
                    <div style="font-weight:600;font-size:14px;">盘镜 DiskLens</div>
                    <div style="font-size:11px;color:var(--faint);">本地磁盘透视</div>
                </div>
            </div>
            <div class="brand-rail">
                <svg width="20" height="20" viewBox="0 0 22 22" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="8.5" stroke="var(--accent)" stroke-width="1.8"/>
                    <circle cx="11" cy="11" r="3.5" fill="var(--accent)"/>
                </svg>
            </div>
            <a class="nav-item" href="#" data-view="overview" aria-current="page" title="概览">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2 8.5H6L8 4L10 11L12 8.5H14" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="nav-label">概览</span>
            </a>
            <a class="nav-item" href="#" data-view="history" title="历史">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2.2 1.4" stroke-linecap="round"/></svg>
                <span class="nav-label">历史</span>
            </a>
            <div class="bottom">
                <a class="nav-item" href="#" data-view="settings" title="设置">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4" stroke-linecap="round"/></svg>
                    <span class="nav-label">设置</span>
                </a>
            </div>
        </aside>

        <main>
            <div class="topbar">
                <span style="font-size:12px;color:var(--faint);" id="view-crumb">盘镜 / 概览</span>
                <span style="flex:1"></span>
                <span class="stamp num" id="freshness"></span>
            </div>
            <div class="sheet-wrap">
                <div class="sheet">
                    <div class="canvas" id="view"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 知识库解释抽屉 -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="explain-drawer" aria-hidden="true">
        <header>
            <h3 style="font-size:16px;font-weight:600;">知识库解释</h3>
            <button class="btn ghost" id="drawer-close">关闭</button>
        </header>
        <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <!-- 扫描范围弹窗 -->
    <div class="modal-backdrop hidden" id="scan-modal">
        <div class="modal">
            <h3>选择扫描范围</h3>
            <div class="sub" id="scan-sub">选择要透视的磁盘，扫描为只读操作</div>
            <div id="scan-drives"></div>
            <div class="progressbar indet hidden" id="scan-bar"><div></div></div>
            <div class="progress-meta hidden" id="scan-meta"></div>
            <div class="scan-error hidden" id="scan-error"></div>
            <footer>
                <button class="btn" id="scan-cancel">关闭</button>
                <button class="btn primary" id="scan-start">开始扫描</button>
            </footer>
        </div>
    </div>

    <script type="module" src="/src/app.js"></script>
</body>
</html>

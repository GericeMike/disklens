<!DOCTYPE html>
<html lang="zh-CN" data-style="terminal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘镜 DiskLens · 概览（M0 风格预览）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/taste/base.css">
    <link rel="stylesheet" href="src/taste/disklens.css">
</head>
<body>
    <div class="app">
        <!-- 外壳: terminal=50px 图标栏 / sheet=228px 标签侧栏，由 CSS 变体切换 -->
        <aside class="sidebar">
            <div class="brand">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="8.5" stroke="var(--accent)" stroke-width="1.8"/>
                    <circle cx="11" cy="11" r="3.5" fill="var(--accent)"/>
                </svg>
                <div>
                    <div style="font-weight:600;font-size:14px;">盘镜 DiskLens</div>
                    <div style="font-size:11px;color:var(--faint);">本机</div>
                </div>
            </div>
            <div class="brand-rail">
                <svg width="20" height="20" viewBox="0 0 22 22" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="8.5" stroke="var(--accent)" stroke-width="1.8"/>
                    <circle cx="11" cy="11" r="3.5" fill="var(--accent)"/>
                </svg>
            </div>
            <a class="nav-item" href="#" aria-current="page" title="概览">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2 8.5H6L8 4L10 11L12 8.5H14" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="nav-label">概览</span>
            </a>
            <a class="nav-item" href="#" title="扫描">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><path d="M8 2.5v2M8 11.5v2M2.5 8h2M11.5 8h2" stroke-linecap="round"/></svg>
                <span class="nav-label">扫描</span>
            </a>
            <a class="nav-item" href="#" title="清理">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8h5.6l.7-8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="nav-label">清理</span>
            </a>
            <a class="nav-item" href="#" title="知识库">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M3 3.5c1.8-.8 3.2-.8 5 .5 1.8-1.3 3.2-1.3 5-.5v9c-1.8-.8-3.2-.8-5 .5-1.8-1.3-3.2-1.3-5-.5v-9Z" stroke-linejoin="round"/><path d="M8 4v9"/></svg>
                <span class="nav-label">知识库</span>
            </a>
            <a class="nav-item" href="#" title="历史">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2.2 1.4" stroke-linecap="round"/></svg>
                <span class="nav-label">历史</span>
            </a>
            <div class="bottom">
                <a class="nav-item" href="#" title="设置">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4" stroke-linecap="round"/></svg>
                    <span class="nav-label">设置</span>
                </a>
            </div>
        </aside>

        <main>
            <!-- framed-sheet 顶栏（terminal 隐藏） -->
            <div class="topbar">
                <span style="font-size:12px;color:var(--faint);">盘镜 / 概览</span>
                <span style="flex:1"></span>
                <span class="stamp num">上次扫描 10-28 21:40</span>
            </div>
            <div class="sheet-wrap">
                <div class="sheet">
                    <div class="canvas">
                        <div class="title-row">
                            <div>
                                <h1>概览</h1>
                                <div class="sub">D 盘仅剩 49.1 GB（10.3%）—— 微信文件 90 天 +18.3 GB，是最大增长源</div>
                            </div>
                            <div style="display:flex;align-items:center;gap:16px;">
                                <div class="style-switch" title="预览专用：正式版为单一风格">
                                    <button data-style="terminal" aria-pressed="true">终端深色</button>
                                    <button data-style="sheet" aria-pressed="false">白纸浅色</button>
                                </div>
                                <span class="stamp num stamp-canvas">上次扫描 10-28 21:40</span>
                                <button class="btn primary">重新扫描</button>
                            </div>
                        </div>

                        <!-- 盘概览: 一个容器 1px 分隔（§5 KPI 是字不是贴片） -->
                        <div class="kpis" id="drives" style="margin-bottom:var(--gap);"></div>

                        <div class="grid-mid">
                            <section class="panel">
                                <header>
                                    <h3 style="font-size:16px;font-weight:600;">D 盘 · 方块地图</h3>
                                    <span class="meta">顶层目录 · 悬停查看 · 正式版点击下钻</span>
                                </header>
                                <div class="panel-body" id="treemap"></div>
                            </section>
                            <section class="panel">
                                <header>
                                    <h3 style="font-size:16px;font-weight:600;">可清理项</h3>
                                    <span class="meta num">可释放 33.8 GB · 另 12.8 GB 需系统操作</span>
                                </header>
                                <div class="panel-body" id="clean-rows"></div>
                                <footer style="padding-top:12px;"><button class="card-link">查看全部 12 项</button></footer>
                            </section>
                        </div>

                        <div class="grid-low">
                            <section class="panel">
                                <header>
                                    <h3 style="font-size:16px;font-weight:600;">90 天空间变化 · D 盘</h3>
                                    <span id="growth-legend" class="meta"></span>
                                </header>
                                <div id="growth-chart"></div>
                            </section>
                            <section class="panel">
                                <header>
                                    <h3 style="font-size:16px;font-weight:600;">最大文件</h3>
                                    <button class="card-link">查看全部 100 个</button>
                                </header>
                                <div class="table-wrap">
                                    <table>
                                        <thead><tr><th>文件</th><th class="n">大小</th><th class="n">修改时间</th></tr></thead>
                                        <tbody id="topfiles-body"></tbody>
                                    </table>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="src/taste/charts.js"></script>
    <script type="module" src="src/preview.js"></script>
</body>
</html>
